name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  go-lint-test:
    name: Go — lint & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingestion, query, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: apps/${{ matrix.service }}/go.mod

      - name: Download dependencies
        working-directory: apps/${{ matrix.service }}
        run: go mod download

      - name: Vet
        working-directory: apps/${{ matrix.service }}
        run: go vet ./...

      - name: Test
        working-directory: apps/${{ matrix.service }}
        run: go test ./... -race -timeout 60s

  go-build:
    name: Go — build
    runs-on: ubuntu-latest
    needs: go-lint-test
    strategy:
      matrix:
        service: [ingestion, query, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: apps/${{ matrix.service }}/go.mod

      - name: Build
        working-directory: apps/${{ matrix.service }}
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o /dev/null ./cmd/main.go

  node-lint-build:
    name: Node — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck dashboard
        working-directory: dashboard
        run: pnpm typecheck

      - name: Build browser SDK
        working-directory: packages/sdk-browser
        run: pnpm build

      - name: Build node SDK
        working-directory: packages/sdk-node
        run: pnpm build

  docker-build:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [go-build, node-lint-build]
    strategy:
      matrix:
        include:
          - service: ingestion
            context: apps/ingestion
          - service: query
            context: apps/query
          - service: worker
            context: apps/worker
          - service: dashboard
            context: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: inspectuser/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
