server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;

    # First-party event ingest: proxy /v2/httpapi + /identify → ingestion service.
    # Same-origin means (a) Brave/uBlock don't block it as a third-party tracker,
    # and (b) the server-set _amp_did identity cookie is first-party & durable.
    location = /v2/httpapi {
        set $ingest_upstream http://ingestion:4000;
        proxy_pass $ingest_upstream/v2/httpapi;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass_request_headers on;
    }
    location = /identify {
        set $ingest_upstream http://ingestion:4000;
        proxy_pass $ingest_upstream/identify;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
    }

    # First-party session-replay ingest: proxy /replay → query service so the
    # browser POSTs to the SAME origin (defeats third-party tracker blockers).
    location = /replay {
        set $replay_upstream http://query:4001;
        proxy_pass $replay_upstream/replay;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
    }

    # Self-hosted recorder lib (first-party, long-cached).
    location = /rrweb.min.js {
        add_header Cache-Control "public, max-age=86400";
    }

    # No-cache for the SPA + SDK so updates always take effect during testing.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
